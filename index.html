<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="QubeCraft: an open-source blocky survival sandbox that runs in your browser.">
  <title>QubeCraft</title>
  <meta name="theme-color" content="#2e2219">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="water-overlay"></div>
    <div id="vignette"></div>
    <div id="debug"></div>
    <div id="chatlog" aria-live="polite"></div>
    <div id="toast" aria-live="polite"></div>
    <div id="cmd"><input type="text" spellcheck="false" autocomplete="off" aria-label="Command"><button type="button" class="close-x" title="Close (Esc)" aria-label="Close chat">×</button></div>
    <div id="resume">Click or press any key to keep playing</div>
    <div id="fade"></div>
    <div id="rotate-hint">Turn your device sideways for the best view.</div>
  </div>
  <div id="boot-error" style="display:none;position:fixed;inset:0;z-index:100;background:#1f1711;color:#efe6d2;font:18px system-ui,sans-serif;padding:32px;line-height:1.5"></div>
  <script>
    // If the game script never starts (stale cache, blocked script, old browser), say so instead of a blank page.
    (function () {
      var errors = [];
      window.addEventListener('error', function (e) { errors.push(e.message || String(e.error)); });
      window.addEventListener('unhandledrejection', function (e) { errors.push(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () {
        if (window.blockhaven) return;
        var box = document.getElementById('boot-error');
        box.style.display = 'block';
        box.innerHTML = '<h1 style="margin-top:0">QubeCraft didn’t start</h1><p>Try reloading the page (Cmd+Shift+R on a Mac, Ctrl+Shift+R elsewhere). Your worlds are stored in this browser and are safe.</p>'
          + (errors.length ? '<p>Error: <code></code></p>' : '') + '<p><button onclick="location.reload()">Reload</button></p>';
        if (errors.length) box.querySelector('code').textContent = errors.join(' | ');
      }, 12000);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
